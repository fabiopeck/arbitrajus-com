<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARBITRAJUS | Under maintenance</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/frontend/assets/img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/frontend/assets/img/favicon-192.png">
  <link rel="canonical" href="https://arbitrajus.com/">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#001428">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: Montserrat, system-ui, sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0, 102, 161, 0.35), transparent 55%),
        radial-gradient(circle at top, #0b2744, #001428 58%);
    }
    .wrap {
      text-align: center;
      max-width: 440px;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.35rem;
      border-radius: 14px;
      display: block;
    }
    .badge {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.28rem 0.7rem;
      border-radius: 999px;
      background: #c9a227;
      color: #001428;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    h1 {
      font-family: Cinzel, serif;
      font-size: clamp(1.75rem, 5vw, 2.2rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 0.85rem;
    }
    p {
      font-size: 0.98rem;
      line-height: 1.65;
      color: rgba(255,255,255,0.82);
      font-weight: 400;
    }
    .line {
      width: 40px;
      height: 2px;
      background: rgba(255,255,255,0.22);
      margin: 1.4rem auto 1rem;
    }
    a.mail {
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.35);
    }
    a.mail:hover { border-bottom-color: #c9a227; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/frontend/assets/img/favicon-192.png" alt="" width="72" height="72" onerror="this.src='/favicon.ico'">
    <span class="badge">Under maintenance</span>
    <h1>ARBITRAJUS</h1>
    <p>We are updating the platform. Online dispute resolution will be back shortly.</p>
</div>
</body>
</html>
