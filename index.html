<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARBITRAJUS</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/favicon-192.png">
  <link rel="canonical" href="https://arbitrajus.com/">
  <meta name="theme-color" content="#ffffff">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: #1a1a1a;
      font-family: Montserrat, system-ui, sans-serif;
      padding: 2rem;
    }
    .wrap {
      text-align: center;
      max-width: 420px;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      border-radius: 12px;
    }
    h1 {
      font-family: Cinzel, serif;
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #001428;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.95rem;
      font-weight: 400;
      color: #6b7280;
      letter-spacing: 0.02em;
    }
    .line {
      width: 40px;
      height: 2px;
      background: #e5e7eb;
      margin: 1.25rem auto 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/assets/favicon-192.png" alt="" width="64" height="64">
    <h1>ARBITRAJUS</h1>
    <p>Em manutenção</p>
    <div class="line"></div>
  </div>
</body>
</html>
