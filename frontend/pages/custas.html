<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico?v=20260818" sizes="any">
  <link rel="icon" type="image/png" href="/frontend/assets/img/favicon-32.png?v=20260818" sizes="32x32">
  <link rel="apple-touch-icon" href="/frontend/assets/img/apple-touch-icon.png?v=20260818">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custas | ARBITRAJUS</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/arbtrato.css">
</head>
<body class="arb-theme">
  <header class="arb-header">
    <div class="arb-header-inner">
      <a href="../../index.html" class="arb-logo" aria-label="ARBITRAJUS">
        <img src="../assets/img/logo-2.png" alt="" class="arb-logo-img" width="72" height="72">
        <span class="arb-logo-text"><span class="arb-logo-arbitra">ARBITRA</span><span class="arb-logo-jus">JUS</span></span>
      </a>
      <a href="../../index.html" class="btn-arb btn-arb-outline">Voltar ao site</a>
    </div>
  </header>
  <div class="arb-page-hero">
    <div class="container"><h1>Custas claras. Decisões conscientes.</h1><p style="opacity:0.9;margin:0.5rem 0 0;">Valores fictícios para demonstração</p></div>
  </div>
  <main class="arb-page-content container">
    <h2 class="arb-section-title">Arbitragem online</h2>
    <table class="arb-table" id="tabela-arbitragem"></table>
    <h2 class="arb-section-title" style="margin-top:3rem;">Mediação online</h2>
    <table class="arb-table" id="tabela-mediacao"></table>
    <p style="margin-top:2rem;color:var(--arb-muted);font-size:0.9rem;">* Tabela demonstrativa. Personalize valores conforme sua política comercial.</p>
    <a href="login.html?tab=signup" class="btn-arb btn-arb-primary" style="margin-top:2rem;">Iniciar procedimento</a>
  </main>
  <script type="module">
    const res = await fetch('../../frontend/data/mock.json');
    const { custas } = await res.json();
    const render = (el, rows) => {
      el.innerHTML = '<tr><th>Faixa de valor da causa</th><th>Taxa administrativa</th></tr>' +
        rows.map((r) => `<tr><td>${r.faixa}</td><td><strong>${r.taxa}</strong></td></tr>`).join('');
    };
    render(document.getElementById('tabela-arbitragem'), custas.arbitragem);
    render(document.getElementById('tabela-mediacao'), custas.mediacao);
  </script>
</body>
</html>
